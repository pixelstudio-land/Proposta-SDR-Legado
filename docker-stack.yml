version: "3.8"

services:
  app:
    image: sdr-legado:v4
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PANEL_PASSWORD=legado123
      - ADMIN_PASSWORD=legado123
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALERT_WHATSAPP=${ALERT_WHATSAPP:-5511913393797}
      - SDR_NOTIFICATION_PHONE=${SDR_NOTIFICATION_PHONE:-5511913393797}
      - CRM_WEBHOOK_URL=${CRM_WEBHOOK_URL}
      - DATABASE_PATH=/app/data/database.sqlite
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - target: 3000
        published: 3150
        mode: host
    volumes:
      - /root/sdr-legado/data:/app/data
      - /root/sdr-legado/config:/app/config
    networks:
      - servenet
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=servenet"
        
        # Rota 1: Dominio Oficial Legado Performance
        - "traefik.http.routers.sdrlegado.entrypoints=websecure"
        - "traefik.http.routers.sdrlegado.rule=Host(`sdr.legadomidia.com`)"
        - "traefik.http.routers.sdrlegado.tls=true"
        - "traefik.http.routers.sdrlegado.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.sdrlegado.service=sdrlegado"
        
        # Rota 2: SSL imediato via sslip.io
        - "traefik.http.routers.sdrsslip.entrypoints=websecure"
        - "traefik.http.routers.sdrsslip.rule=Host(`sdr.187-124-91-244.sslip.io`)"
        - "traefik.http.routers.sdrsslip.tls=true"
        - "traefik.http.routers.sdrsslip.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.sdrsslip.service=sdrlegado"
        
        # Servico Backend
        - "traefik.http.services.sdrlegado.loadbalancer.server.port=3000"

networks:
  servenet:
    external: true
